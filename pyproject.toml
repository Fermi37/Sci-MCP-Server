[project]
name = "sci-mcp-server"
version = "0.2.0"
description = "MCP server for searching and downloading academic papers through Sci-Hub mirrors"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "mcp>=0.1.0",
    "requests>=2.31.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live_network: tests that require Crossref, Sci-Hub mirrors, and network access",
]
